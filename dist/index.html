<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mozi Evals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead"><div><strong>Mozi Evals</strong>
    <nav class="tabs" role="tablist" aria-label="Evaluation workspace">
      <button role="tab" id="tab-manifest" aria-controls="panel-manifest" aria-selected="true" tabindex="0">Manifest <span id="case-count"></span></button>
      <button role="tab" id="tab-evaluations" aria-controls="panel-evaluations" aria-selected="false" tabindex="-1">Evaluations <span id="eval-count"></span></button>
    </nav>
  </div></header>
  <main>
    <section id="panel-manifest" role="tabpanel" aria-labelledby="tab-manifest">
      <div class="heading"><h1>Eval manifest</h1><span id="dataset-meta" class="muted"></span></div>
      <p id="manifest-status" role="status">Loading manifest…</p>
      <details class="criteria-block" open><summary>Judgment criteria <span>Scores 0–1</span></summary><div id="criteria"></div></details>
      <div id="cases"></div>
      <details class="methodology"><summary>Method & limitations</summary><div id="method"></div></details>
    </section>
    <section id="panel-evaluations" role="tabpanel" aria-labelledby="tab-evaluations" hidden>
      <div class="heading"><h1>Evaluations</h1><button id="run" class="primary" hidden>Run evals</button></div>
      <p id="status" role="status">Loading…</p>
      <div class="table-scroll" role="region" aria-label="All evaluations" tabindex="0"><table><thead><tr><th scope="col">Case</th><th scope="col">Prompt</th><th scope="col">Expected constraint</th><th scope="col">Actual output</th><th scope="col">Diagnosis</th><th scope="col">Grounding</th><th scope="col">Missing info</th><th scope="col">Label match</th><th scope="col">Latency</th></tr></thead><tbody id="evals"></tbody></table></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
